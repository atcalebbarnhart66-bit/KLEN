# _data/agencies.yml
#
# Single source of truth for the Agency Information map and county pages.
# Structure: a list of all 105 Kansas counties, each with its agencies.
#
# FIELDS PER COUNTY
#   name  - county name
#   fips  - 5-digit FIPS code (source: U.S. Census Bureau)
#   slug  - used to build the county's URL, /agencies/<slug>/
#   seat  - county seat city
#   page  - true generates a page at /agencies/<slug>/, false does not.
#           Every county is false by default. See README.md for how to
#           turn a county page on.
#   agencies - list of { name, type, url }
#       type is one of: Sheriff, Municipal PD, Campus, State, Other
#       url is intentionally left blank on every entry. Agency names
#       only become links once a county's page flag is true AND a url
#       is filled in (see README.md).
#
# VERIFICATION NOTE (last checked 2026-09-18)
# Every county's sheriff's office and county seat is standard, well-
# documented public information. Municipal, campus, and tribal entries
# below were additionally cross-checked with live web searches against
# Wikipedia's "List of law enforcement agencies in Kansas", the Kansas
# Sheriffs' Association, municipal police directory aggregators (PoliceApp,
# usacops.com, Police Locator), and individual city/tribal government
# sources. Kansas has roughly 360+ law enforcement agencies statewide per
# the U.S. Bureau of Justice Statistics' Census of State and Local Law
# Enforcement Agencies; this file lists every county's sheriff plus the
# larger/well-documented municipal, campus, and tribal departments -- it
# intentionally does NOT claim to include every small-town department in
# the state (many small cities contract with their county sheriff instead
# of running their own department, and that varies over time). Statewide
# agencies (Kansas Highway Patrol, KBI, etc.) are not county-specific and
# live separately in _data/state_agencies.yml.
#
# Please still verify every entry -- especially department names,
# jurisdiction boundaries, and current operational status -- before
# publishing contact details or links. Entries with a known, specific
# concern are flagged inline with an UNVERIFIED comment.

