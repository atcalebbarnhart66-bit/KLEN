<header class="site-header">
  <div class="wrap site-header__bar">
    <a class="site-header__brand" href="{{ '/' | relative_url }}" aria-label="KLEN home">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 48 48">
          <path d="M24 3 42 9v14c0 11-7.6 18.5-18 22C13.6 41.5 6 34 6 23V9z" fill="none" stroke="currentColor" stroke-width="2"/>
          <path d="M24 11v22M13 22h22M17 15l7 7 7-7M17 29l7-7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="24" cy="22" r="3" fill="currentColor"/>
        </svg>
      </span>
      <span class="site-header__wordmark">
        <span class="site-header__title">KLEN</span>
        <span class="site-header__subtitle">Kansas Law Enforcement Network</span>
      </span>
    </a>

    <div class="site-header__actions">
      <div class="site-header__auth" id="header-auth">
        <div class="auth-buttons" id="auth-buttons">
          <a class="btn btn--outline btn--sm" href="{{ '/login/' | relative_url }}">Log In</a>
          <a class="btn btn--primary btn--sm" href="{{ '/register/' | relative_url }}">Register</a>
        </div>
        <div class="user-menu" id="user-menu" hidden>
          <button type="button" class="user-menu__toggle" id="user-menu-toggle" aria-expanded="false" aria-haspopup="true">
            <img class="user-menu__avatar" id="user-menu-avatar" src="" alt="" hidden>
            <span class="user-menu__initials" id="user-menu-initials" aria-hidden="true"></span>
            <span class="visually-hidden">Account menu</span>
          </button>
          <div class="user-menu__dropdown" id="user-menu-dropdown">
            <p class="user-menu__name" id="user-menu-name"></p>
            <a href="{{ '/dashboard/' | relative_url }}">Dashboard</a>
            <a href="{{ '/profile/' | relative_url }}">Profile</a>
            <button type="button" data-signout class="user-menu__signout">Log Out</button>
          </div>
        </div>
      </div>

      <button type="button" class="nav-toggle" id="nav-toggle" aria-expanded="false" aria-controls="site-nav">
        <span class="visually-hidden">Menu</span>
        <span class="nav-toggle__icon" aria-hidden="true"><span></span><span></span><span></span></span>
      </button>
    </div>
  </div>

  <nav class="site-nav" id="site-nav" aria-label="Primary">
    <div class="wrap">
      <ul class="site-nav__list">
        <li><a href="{{ '/' | relative_url }}" {% if page.url == '/' %}aria-current="page"{% endif %}>Home</a></li>
        <li><a href="{{ '/news/' | relative_url }}" {% if page.url == '/news/' %}aria-current="page"{% endif %}>News</a></li>
        <li><a href="{{ '/blog/' | relative_url }}" {% if page.url == '/blog/' %}aria-current="page"{% endif %}>Blog</a></li>
        <li><a href="{{ '/agencies/' | relative_url }}" {% if page.url contains '/agencies' %}aria-current="page"{% endif %}>Agency Directory</a></li>
        <li><a href="{{ '/contact/' | relative_url }}" {% if page.url == '/contact/' %}aria-current="page"{% endif %}>Contact</a></li>
        <li class="site-nav__cta"><a href="{{ '/agencies/' | relative_url }}">Find an Agency <span aria-hidden="true">→</span></a></li>
      </ul>
    </div>
  </nav>
</header>
