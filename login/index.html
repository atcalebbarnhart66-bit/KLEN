---
layout: default
title: Log In
permalink: /login/
extra_js: login
description: Log in to your KLEN member account.
---
<div class="page-header">
  <div class="wrap">
    <h1>Log In</h1>
    <p>Access your KLEN member account.</p>
  </div>
</div>

<div class="wrap section">
  <div class="prose">
    <div class="form-status form-status--error" id="form-status" role="alert"></div>

    <form id="login-form" novalidate>
      <div class="field" data-field="email">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" autocomplete="email" required aria-required="true">
      </div>

      <div class="field" data-field="password" style="margin-top: 1.5rem;">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required aria-required="true">
      </div>

      <button type="submit" class="btn btn--primary" style="margin-top: 1.5rem;">Log In</button>
      <p class="hint" style="margin-top: 1rem;">Don&rsquo;t have an account? <a href="{{ '/register/' | relative_url }}">Register</a>.</p>
    </form>
  </div>
</div>
